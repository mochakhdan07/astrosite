[build]
  command = "npm run build"
  publish = "dist"

# Certificate verification links: /verify, /verify/, /verify/ARIJU-001
[[redirects]]
  from = "/verify/*"
  to = "/verify.html"
  status = 200

# Always revalidate HTML so a page never points at script files from an older
# deploy (which shows up as a blank screen).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/verify"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
